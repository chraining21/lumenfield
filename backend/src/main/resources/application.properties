spring.application.name=light-backend

# 資料表結構只由 Flyway 管理（docs/ADR-001 §5），Hibernate 只檢查不建表
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# 時間一律以 UTC 存進 DATETIME，顯示時再轉台灣時間
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# 列表載入分類、圖片時一次批次查，避免每筆各查一次（N+1）
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# 錯誤回應用 RFC 9457 Problem Details 格式
spring.mvc.problemdetails.enabled=true

# 健康檢查對外只回 UP／DOWN，不透露內部元件
management.endpoints.web.exposure.include=health

# 上傳檔案存放處（後端主機的資料夾）；照片上限 10MB、檔案 50MB（UploadController）
app.upload-dir=./uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB

# 後台登入閒置 2 小時後失效（編輯產品可能花比較久，不用預設的 30 分鐘）
server.servlet.session.timeout=2h

# 背景工作（寄信）用 Java 21 虛擬執行緒
spring.threads.virtual.enabled=true

# 詢價通知信；寄信伺服器逾時設短，避免卡住
# TODO: 收件人待確認（SPEC §10），未設定就不寄；寄件人與寄信伺服器在部署階段決定
app.inquiry.notify-to=
app.mail.from=noreply@example.com
app.admin-url=http://localhost:3000/admin
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# 寄信伺服器故障不代表網站故障（詢價照樣存得進去），不列入健康檢查
management.health.mail.enabled=false

# 公開 demo 的設定見 application-demo.properties 與 docs/DEPLOY.md
