# 本機開發：mvn spring-boot:run 會自動帶 dev，並由 compose.yaml 啟動 MySQL（連線資訊自動帶入）
management.endpoint.health.show-details=always

# 開發用假資料（產品、案例、詢價、測試管理者）只在 dev 載入；正式只有 db/migration
spring.flyway.locations=classpath:db/migration,classpath:db/dev

# 通知信寄到 compose 的 Mailpit（http://localhost:8025 查看），不會真的寄出
spring.mail.host=localhost
spring.mail.port=1025
app.inquiry.notify-to=sales@example.com
