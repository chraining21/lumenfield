# 公開 demo（Render＋TiDB Cloud，docs/DEPLOY.md）：範例資料＋唯讀 demo 帳號
# 資料庫連線由環境變數提供：SPRING_DATASOURCE_URL、SPRING_DATASOURCE_USERNAME、SPRING_DATASOURCE_PASSWORD
spring.flyway.locations=classpath:db/migration,classpath:db/sample
spring.docker.compose.enabled=false

# Render 以 PORT 環境變數指定埠號
server.port=${PORT:8080}

# 公開的唯讀帳號（README 有寫）；可讀寫的管理者帳密只放在主機的環境變數
app.admin.viewer.username=demo
app.admin.viewer.password=lumenfield-demo
app.admin.owner.username=${OWNER_USERNAME:}
app.admin.owner.password=${OWNER_PASSWORD:}

# 免費主機只有 512MB 記憶體，連線池縮小
spring.datasource.hikari.maximum-pool-size=5
